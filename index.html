<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 90vw;
            width: 100%;
        }
        .scene {
            display: none;
            padding: 20px;
            background-color: #34495e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .scene.active {
            display: block;
        }
        h1, h2 {
            margin-top: 0;
            color: #ecf0f1;
        }
        input, select {
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            width: 200px;
        }
        .gear-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            color: #ecf0f1;
            transition: transform 0.3s;
        }
        .gear-btn:hover {
            transform: rotate(90deg);
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled,
        button.is-disabled {
            background-color: #95a5a6;
            color: #ecf0f1;
            cursor: not-allowed;
        }
        button:disabled:hover,
        button.is-disabled:hover {
            background-color: #95a5a6;
        }
        button.secondary {
            background-color: #95a5a6;
        }
        button.secondary:hover {
            background-color: #7f8c8d;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
        }
        .button-group.compact {
            gap: 6px;
            margin: 6px 0 0;
        }
        .toggle-button {
            background-color: #3b4d61;
            border: 1px solid transparent;
        }
        .toggle-button.compact-btn {
            padding: 6px 12px;
            font-size: 13px;
            margin: 0;
        }
        .toggle-button:hover {
            background-color: #2f3f52;
        }
        .toggle-button.active {
            background-color: #f1c40f;
            color: #1f2933;
            border-color: #f39c12;
            box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.18);
        }
        #playerName {
            max-width: 200px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #bdc3c7;
        }
        #gameInfo {
            margin-bottom: 12px;
        }
        .game-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .game-toolbar-left,
        .game-toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .game-toolbar .button-group {
            margin: 0;
        }
        #gameSummary {
            margin: 0;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 13px;
            color: #ecf0f1;
            white-space: nowrap;
        }
        #gameSummary .summary-score {
            color: #f1c40f;
            font-weight: bold;
        }
        .game-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .game-actions button {
            padding: 6px 10px;
            font-size: 13px;
            margin: 0;
        }
        #gameCanvas {
            border: 2px solid #3498db;
            border-radius: 5px;
            background-color: #ffffff;
            margin: 10px auto;
            width: min(600px, calc(100vw - 48px));
            max-width: 100%;
            height: auto;
            display: block;
        }
        #gameTextInput {
            width: min(420px, calc(100vw - 64px));
            box-sizing: border-box;
            text-align: center;
            margin: 10px 0 4px;
            padding: 10px 14px;
            border: 2px solid #f1c40f;
            border-radius: 6px;
            background-color: #ffffff;
            color: #1f2933;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0;
            outline: none;
            box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.16);
        }
        #gameTextInput:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.24);
        }
        #gameTextInput::placeholder {
            color: #6b7280;
            font-weight: normal;
        }
        .game-controls {
            margin-top: 0;
        }
        .rank-controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #leaderboardList {
            text-align: left;
            max-width: 300px;
            margin: 20px auto;
            background-color: #2c3e50;
            border-radius: 5px;
            padding: 15px;
        }
        .rank-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #34495e;
        }
        .rank-entry:last-child {
            border-bottom: none;
        }
        .rank-position {
            color: #f39c12;
            font-weight: bold;
            min-width: 30px;
        }
        .rank-name {
            flex: 1;
            margin-left: 10px;
            color: #ecf0f1;
        }
        .rank-score {
            color: #3498db;
            font-weight: bold;
        }
        .rank-entry.highlight {
            background-color: #34495e;
            border-radius: 3px;
            margin: 2px 0;
            padding: 10px;
        }
        .page-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: rgba(236, 240, 241, 0.8);
        }
        .page-footer a {
            color: #f1c40f;
            text-decoration: none;
        }
        .page-footer a:hover {
            text-decoration: underline;
        }
        /* Responsive design  */
        @media (max-width: 100vw) {
            #gameCanvas {
                max-width: calc(100vw - 48px);
                height: auto;
            }
            #gameSummary {
                white-space: normal;
            }
            .game-toolbar {
                justify-content: center;
            }
            .game-toolbar-left,
            .game-toolbar-right {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="scene-intro" class="scene active">
            <button id="showConfigBtn" class="gear-btn" title="設定">⚙️</button>
            <h1>Intro scene</h1>
            <div class="input-group">
                <label for="playerName">玩家姓名 (最多10個字):</label>
                <input type="text" id="playerName" placeholder="請輸入您的姓名" maxlength="10">
            </div>
            <div class="input-group">
                <label for="wordListSelect">單字列表:</label>
                <select id="wordListSelect">
                </select>
            </div>
            <button id="startGameBtn" disabled>開始遊戲</button>
            <button id="showRankBtn" class="secondary">排行榜</button>
        </div>
        <div id="scene-config" class="scene">
            <h1>Config scene</h1>
            <div style="margin-bottom: 20px;">
                <button id="uploadWordsBtn">上傳新列表</button>
                <input type="file" id="wordListFileInput" accept=".txt" style="display: none;">
            </div>
            
            <div id="customWordListsContainer" style="margin: 20px auto; max-width: 320px; text-align: left; background-color: #2c3e50; padding: 15px; border-radius: 5px;">
                <h3 style="margin-top: 0; color: #ecf0f1; border-bottom: 1px solid #34495e; padding-bottom: 8px;">自訂單字列表</h3>
                <div id="customWordListsList">
                    <!-- Custom word lists will be dynamically added here -->
                </div>
            </div>

            <button id="clearRankConfigBtn" class="secondary">清空排行榜</button>
            <button id="backFromConfigBtn" class="secondary">返回</button>
        </div>

        <div id="scene-game" class="scene">
            <div id="gameInfo">
                <div class="game-toolbar">
                    <div class="game-toolbar-left">
                        <div id="gameSummary"><span class="summary-status">準備開始遊戲...</span><span class="summary-divider">|</span><span class="summary-score">得分: 0</span></div>
                        <div class="button-group compact" role="group" aria-label="遊戲難度">
                            <button type="button" class="toggle-button compact-btn active" data-difficulty="easy">🐢</button>
                            <button type="button" class="toggle-button compact-btn" data-difficulty="normal">🚲</button>
                            <button type="button" class="toggle-button compact-btn" data-difficulty="hard">🚗</button>
                        </div>
                    </div>
                    <div class="game-toolbar-right">
                        <div class="game-actions">
                            <button id="restartGameBtn">重新開始</button>
                            <button id="stopGameBtn" class="secondary">立即結束</button>
                            <button id="backFromGameBtn" class="secondary">返回</button>
                        </div>
                    </div>
                </div>
            </div>
            <canvas id="gameCanvas" width="600" height="600"></canvas>
            <div style="margin: 5px 0;">
                <input type="text" id="gameTextInput" placeholder="在此輸入..." autocomplete="off">
            </div>
        </div>
        <div id="scene-rank" class="scene">
            <h2>🏆 排行榜 🏆</h2>
            <div id="leaderboardList">
                <p>暫無記錄</p>
            </div>
            <div class="rank-controls">
                <button id="clearRankBtn" class="secondary">清空排行榜</button>
                <button id="backFromRankBtn" class="secondary">返回</button>
            </div>
        </div>
        <footer class="page-footer">
            <a href="https://github.com/walkingice/typing" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
