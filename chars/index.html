<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10141f;
            --panel: #182033;
            --panel-alt: #121827;
            --border: #2a3550;
            --text: #ecf2ff;
            --muted: #a8b3cc;
            --accent: #6ea8fe;
            --accent-soft: #2d4575;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(110, 168, 254, 0.18), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .panel {
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
        }

        .panel-top {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            background: rgba(24, 32, 51, 0.92);
        }

        .panel-main {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            font-size: 1.4rem;
            color: var(--muted);
        }

        .panel-bottom {
            flex: 0 0 clamp(260px, 34vh, 360px);
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            background: var(--panel-alt);
            color: var(--muted);
        }

        .panel-bottom.is-collapsed {
            flex: 0 0 auto;
            min-height: 0;
            padding-bottom: 12px;
        }

        .keyboard-body.is-hidden {
            display: none;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
        }

        .control-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: nowrap;
            width: 100%;
        }

        .control-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .practice-mode-group {
            display: inline-flex;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.03);
        }

        button.mode-toggle {
            border: 0;
            border-right: 1px solid var(--border);
            border-radius: 0;
            padding: 9px 14px;
            background: transparent;
            color: var(--muted);
            font-size: 0.92rem;
        }

        button.mode-toggle:last-child {
            border-right: 0;
        }

        button.mode-toggle.is-selected {
            background: var(--accent);
            color: #0e172b;
        }

        button.primary-action {
            min-width: 4.5rem;
        }

        button.primary-action:active {
            background: #7dffb2;
            color: #10261a;
            transform: translateY(-1px);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .status-item,
        .status-button {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
        }

        .status-button {
            appearance: none;
            cursor: pointer;
            font: inherit;
            color: inherit;
        }

        .status-label {
            color: var(--muted);
            font-size: 0.84rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-value {
            color: var(--text);
            font-weight: 700;
        }

        .practice-text {
            max-width: min(100%, 72rem);
        }

        .keyboard-titlebar {
            appearance: none;
            width: 100%;
            margin: 0 0 12px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }

        .keyboard-titlebar:focus-visible,
        .status-button:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .keyboard-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .keyboard-symbol-row {
            margin-bottom: -8px;
            transform: translateY(4px);
        }

        .keyboard-symbol-row .keyboard-key:nth-child(1),
        .keyboard-symbol-row .keyboard-key:nth-child(2) {
            left: -18px;
        }

        .keyboard-symbol-row .keyboard-key:nth-child(10) {
            left: 18px;
        }

        .keyboard-key-spacer {
            min-width: 2.2rem;
            padding: 10px 12px;
        }

        .keyboard-key {
            position: relative;
            min-width: 2.2rem;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            text-align: center;
            text-transform: uppercase;
        }

        .keyboard-key.is-current {
            border-color: var(--accent);
            background: var(--accent);
            color: #0e172b;
            box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.2), 0 0 18px rgba(110, 168, 254, 0.45);
            transform: translateY(-2px);
        }

        .keyboard-key.is-pressed {
            border-color: #7dffb2;
            background: #7dffb2;
            color: #10261a;
            box-shadow: 0 0 0 3px rgba(125, 255, 178, 0.2), 0 0 18px rgba(125, 255, 178, 0.45);
            transform: translateY(-2px);
        }

        .practice-target-text {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            line-height: 1.4;
            font-size: clamp(1.5rem, 3vw, 2.4rem);
        }

        .practice-target-line {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .practice-char {
            min-width: 0.7em;
            padding: 0 3px;
            border-radius: 4px;
            text-align: center;
        }

        .practice-char.is-group-end {
            margin-right: 16px;
        }

        .practice-char.is-correct {
            color: #7dffb2;
        }

        .practice-char.is-incorrect {
            color: #ff8b8b;
            background: rgba(255, 72, 72, 0.14);
        }

        .practice-char.is-current {
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        .panel-main.is-error-flash {
            background:
                radial-gradient(circle at top, rgba(255, 75, 75, 0.28), transparent 58%),
                #5c141b;
        }

        button {
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 10px 14px;
            background: var(--accent);
            color: #0e172b;
            font: inherit;
            font-weight: 700;
        }

        button.secondary {
            background: var(--accent-soft);
            border-color: var(--border);
            color: var(--text);
        }


        @media (max-width: 640px) {
            .panel-top {
                align-items: stretch;
            }

            .control-bar {
                flex-wrap: wrap;
            }

            .status-row {
                flex-wrap: wrap;
            }

            .control-row {
                justify-content: flex-start;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="main.js"></script>
</body>
</html>
