<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10141f;
            --panel: #182033;
            --panel-alt: #121827;
            --border: #2a3550;
            --text: #ecf2ff;
            --muted: #a8b3cc;
            --accent: #6ea8fe;
            --accent-soft: #2d4575;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(110, 168, 254, 0.18), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .panel {
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
        }

        .panel-top {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(24, 32, 51, 0.92);
        }

        .panel-main {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            font-size: 1.4rem;
            color: var(--muted);
        }

        .panel-bottom {
            flex: 0 0 25vh;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-alt);
            color: var(--muted);
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 10px 14px;
            background: var(--accent);
            color: #0e172b;
            font: inherit;
            font-weight: 700;
        }

        button.secondary {
            background: var(--accent-soft);
            border-color: var(--border);
            color: var(--text);
        }

        @media (max-width: 640px) {
            .panel-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .control-row {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="main.js"></script>
</body>
</html>
