<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10141f;
            --panel: #182033;
            --panel-alt: #121827;
            --border: #2a3550;
            --text: #ecf2ff;
            --muted: #a8b3cc;
            --accent: #6ea8fe;
            --accent-soft: #2d4575;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(110, 168, 254, 0.18), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .panel {
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
        }

        .panel-top {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            background: rgba(24, 32, 51, 0.92);
        }

        .panel-main {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            font-size: 1.4rem;
            color: var(--muted);
        }

        .panel-bottom {
            flex: 0 0 25vh;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            background: var(--panel-alt);
            color: var(--muted);
        }

        .panel-bottom.is-hidden {
            display: none;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
        }

        .status-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
        }

        .status-label {
            color: var(--muted);
            font-size: 0.84rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-value {
            color: var(--text);
            font-weight: 700;
        }

        .practice-text {
            max-width: min(100%, 72rem);
        }

        .practice-target-label {
            margin: 0 0 6px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .practice-target-description {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .keyboard-title {
            margin: 0 0 12px;
            color: var(--text);
            font-weight: 700;
        }

        .keyboard-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .keyboard-key {
            min-width: 2.2rem;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            text-align: center;
            text-transform: uppercase;
        }

        .practice-target-text {
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            line-height: 1.8;
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            word-break: break-word;
        }

        .practice-char {
            padding: 0 1px;
            border-radius: 4px;
        }

        .practice-char.is-correct {
            color: #7dffb2;
        }

        .practice-char.is-incorrect {
            color: #ff8b8b;
            background: rgba(255, 72, 72, 0.14);
        }

        .practice-char.is-current {
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        body.is-error-flash {
            background:
                radial-gradient(circle at top, rgba(255, 75, 75, 0.24), transparent 38%),
                #2a1013;
        }

        button {
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 10px 14px;
            background: var(--accent);
            color: #0e172b;
            font: inherit;
            font-weight: 700;
        }

        button.secondary {
            background: var(--accent-soft);
            border-color: var(--border);
            color: var(--text);
        }

        @media (max-width: 640px) {
            .panel-top {
                align-items: stretch;
            }

            .control-row {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="main.js"></script>
</body>
</html>
